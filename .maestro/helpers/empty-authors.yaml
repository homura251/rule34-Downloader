appId: com.homura251.rule34downloader.e2e
name: empty-authors
---
- runScript:
    file: ../scripts/control.js
    env:
      CONTROL: reset=1
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: api-user-id
    timeout: 90000
- scrollUntilVisible:
    element: "稍后配置，浏览本地资料库"
    direction: DOWN
- tapOn: "稍后配置，浏览本地资料库"
- tapOn:
    id: nav-settings
- scrollUntilVisible:
    element:
      id: link-downloads
    direction: DOWN
- tapOn:
    id: link-downloads
- tapOn: "empty_recovery_case"
- tapOn: "(?i)(use this folder|allow access to.*)"
- tapOn:
    text: "(?i)allow"
    optional: true
- tapOn:
    id: nav-subscriptions
- scrollUntilVisible:
    element:
      id: artist-maestro_empty_one
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: artist-maestro_empty_two
    direction: UP
    timeout: 60000
- assertVisible: "等待 API 验证"
- runScript: ../scripts/stats.js
- assertTrue: ${output.lists == 0 && output.originals == 0}
- stopApp
- launchApp:
    permissions:
      all: deny
- runFlow: login.yaml
- tapOn:
    id: nav-subscriptions
- scrollUntilVisible:
    element:
      id: artist-maestro_empty_one
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: artist-count-maestro_empty_one
      text: "3 已下载 · 0 待下载"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: artist-maestro_empty_two
    direction: UP
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: artist-count-maestro_empty_two
      text: "3 已下载 · 0 待下载"
    timeout: 60000
- runScript: ../scripts/stats.js
- assertTrue: ${output.originals == 6}

# Removing an author retains the files and must survive automatic startup discovery.
- scrollUntilVisible:
    element:
      id: artist-menu-maestro_empty_one
    direction: DOWN
    timeout: 60000
- tapOn:
    id: artist-menu-maestro_empty_one
- tapOn:
    id: remove-maestro_empty_one
- tapOn:
    id: confirm-remove
- scrollUntilVisible:
    element:
      id: subscriptions-total
    direction: UP
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: subscriptions-total
      text: "1"
    timeout: 30000
- stopApp
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: subscriptions-total
      text: "1"
    timeout: 60000
- assertNotVisible:
    id: artist-maestro_empty_one
- tapOn:
    id: nav-settings
- scrollUntilVisible:
    element:
      id: link-downloads
    direction: DOWN
- tapOn:
    id: link-downloads
- tapOn: "(?i)(use this folder|allow access to.*)"
- tapOn:
    text: "(?i)allow"
    optional: true
- tapOn:
    id: nav-subscriptions
- extendedWaitUntil:
    visible:
      id: subscriptions-total
      text: "2"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: artist-maestro_empty_one
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: artist-count-maestro_empty_one
      text: "3 已下载 · 0 待下载"
    timeout: 60000
- runScript: ../scripts/stats.js
- assertTrue: ${output.originals == 6}
- takeScreenshot: empty-authors-restored-without-entering-tags
- stopApp
- launchApp:
    permissions:
      all: deny
- scrollUntilVisible:
    element:
      id: artist-maestro_empty_two
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: artist-count-maestro_empty_two
      text: "3 已下载 · 0 待下载"
    timeout: 60000
- runScript: ../scripts/stats.js
- assertTrue: ${output.originals == 6}
