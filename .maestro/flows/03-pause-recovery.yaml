appId: com.homura251.rule34downloader.e2e
name: 03-pause-recovery
---
- runScript:
    file: ../scripts/control.js
    env:
      CONTROL: reset=1&slow=1
- launchApp:
    clearState: true
- runFlow: ../helpers/login.yaml
- runFlow:
    file: ../helpers/subscribe.yaml
    env:
      ARTIST: maestro_pause
- tapOn:
    id: nav-tasks
- extendedWaitUntil:
    visible: "下载中"
    timeout: 30000
- tapOn: "全部暂停"
- extendedWaitUntil:
    visible:
      id: task-sync-maestro_pause
      text: "继续"
    timeout: 30000
- stopApp
- launchApp
- assertVisible: "已暂停"
- tapOn:
    id: nav-tasks
- tapOn: "已暂停"
- assertVisible: "maestro_pause"
- tapOn: "继续暂停任务"
- tapOn: "全部"
- extendedWaitUntil:
    visible: "3 已下载 · 0 待下载 · 0 失败"
    timeout: 60000
- runScript: ../scripts/stats.js
- assertTrue: ${output.originals == 4}
- tapOn:
    id: nav-settings
- scrollUntilVisible:
    element:
      id: wifi-only
    direction: DOWN
- tapOn:
    id: wifi-only
- scrollUntilVisible:
    element:
      id: auto-sync
    direction: DOWN
- tapOn:
    id: auto-sync
- tapOn: "15 分钟"
- scrollUntilVisible:
    element:
      id: save-settings
    direction: DOWN
- tapOn:
    id: save-settings
- assertVisible: "下载设置已保存。"
- stopApp
- launchApp
- tapOn:
    id: nav-settings
- scrollUntilVisible:
    element:
      id: wifi-only
    direction: DOWN
- assertVisible:
    id: wifi-only
    checked: true
- scrollUntilVisible:
    element:
      id: auto-sync
    direction: DOWN
- assertVisible:
    id: auto-sync
    checked: true
- assertVisible: "15 分钟"
- takeScreenshot: settings-persisted
