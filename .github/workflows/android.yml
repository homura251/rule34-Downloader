name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Unit tests and debug build
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug
      - name: Check signed release build with a temporary test key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ci-verification-only
          ANDROID_KEY_ALIAS: ci
          ANDROID_KEY_PASSWORD: ci-verification-only
        run: |
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=CI Verification Only"
          ./gradlew --stacktrace --no-configuration-cache assembleRelease
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Remove temporary test key
        if: always()
        run: rm -f "$RUNNER_TEMP/ci-signing.jks"
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rule34-Downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  webview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android CLI
        run: |
          curl --fail --silent --show-error --location \
            https://dl.google.com/android/cli/latest/linux_x86_64/android-cli \
            --output "$RUNNER_TEMP/android"
          chmod +x "$RUNNER_TEMP/android"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/android" --no-metrics --version
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Application UI, WebView and MediaStore end-to-end tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/controlled-e2e.sh
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/e2e-evidence/
          if-no-files-found: warn
      - name: Upload matching application and instrumentation APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
  live-origin-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Live Cloudflare policy is external; keep its failure visible without replacing controlled regressions.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual anonymous origin to verified file
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/live-origin-test.sh
      - name: Upload live origin result, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-origin-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/live-e2e-evidence/
          if-no-files-found: warn
  publish-debug:
    needs: [build, webview-tests]
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-debug]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: rule34-Downloader-debug
          path: app/build/outputs/apk/debug/
      - name: Prepare versioned debug APK
        id: debug_release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-debug]')
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          version = re.search(r'versionName\s*=\s*"([^"]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9]+)*', version):
              raise SystemExit('Invalid versionName')
          apk = f'rule34-Downloader-v{version}-debug.apk'
          shutil.copyfile('app/build/outputs/apk/debug/app-debug.apk', apk)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag=debug-v{version}\napk={apk}\n')
          PY
      - name: Publish debug GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-debug]')
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUG_VERSION: ${{ steps.debug_release.outputs.version }}
          DEBUG_TAG: ${{ steps.debug_release.outputs.tag }}
          DEBUG_APK: ${{ steps.debug_release.outputs.apk }}
        run: |
          gh release delete "$DEBUG_TAG" --cleanup-tag --yes || true
          gh release create "$DEBUG_TAG" "$DEBUG_APK" \
            --target "$GITHUB_SHA" \
            --title "rule34-Downloader v$DEBUG_VERSION Debug" \
            --generate-notes \
            --prerelease
